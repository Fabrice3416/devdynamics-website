<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | DevDynamics</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="../assets/images/new_icon_2.jpg">

  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/site.css?v=14">
  <link rel="stylesheet" href="../css/pages/admin.css?v=14">
</head>
<body class="admin-login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <img class="logo-light" src="../assets/images/logo_6.png" alt="DevDynamics" width="457" height="73">
        <img class="logo-dark" src="../assets/images/logo_6_white.png" alt="DevDynamics" width="184" height="31">
        <p>Espace d'administration</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>

        <p class="login-footer">
          <a href="../index.html">Retour au site</a>
        </p>
      </form>
    </div>
  </div>

  <script src="../js/api.js?v=14"></script>
  <script src="../js/utils.js?v=14"></script>
  <script src="../js/pages/admin-login.js?v=14"></script>
</body>
</html>
